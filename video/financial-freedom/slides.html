<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Financial Freedom — 30s (source)</title>
<style>
  /* ฟอนต์ถูกฝังเป็น data-URI โดย render.mjs (ไม่ต้องโหลดจากเน็ตตอนเรนเดอร์) */
  @font-face { font-family: 'InterVar'; src: url(__INTER__) format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'ThaiVar'; src: url(__THAI__) format('truetype'); font-weight: 100 900; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: 'InterVar', 'ThaiVar', system-ui, sans-serif; color: #eaf4ff; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1920px; height: 1080px; padding: 96px 150px; display: flex; flex-direction: column; justify-content: center; }

  /* ── กรอบอ้างอิง: แบรนด์ · เลขขั้น · แถบความคืบหน้า ── */
  .brand { position: absolute; left: 150px; top: 84px; display: flex; align-items: center; gap: 18px; }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: #67e8f9; box-shadow: 0 0 22px #22d3ee; }
  .brand .txt { font-size: 24px; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; color: #bcd7f5; }
  .brand .sep { width: 60px; height: 1px; background: rgba(255,255,255,0.28); }
  .brand .sub { font-size: 22px; font-weight: 600; letter-spacing: 0.16em; color: #7fb4e8; }

  .dots { position: absolute; left: 150px; bottom: 84px; display: flex; gap: 12px; }
  .dots i { display: block; width: 34px; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.16); }
  .dots i.on { background: #67e8f9; box-shadow: 0 0 18px rgba(103,232,249,0.8); width: 74px; }

  .clock { position: absolute; right: 150px; bottom: 78px; font-size: 24px; font-weight: 700; letter-spacing: 0.22em; color: #86a8cc; }

  /* ── องค์ประกอบข้อความ ── */
  .kicker { font-size: 28px; font-weight: 800; letter-spacing: 0.4em; text-transform: uppercase; color: #67e8f9; }
  .kicker.gold { color: #fcd34d; }
  h1 { font-size: 168px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; }
  h2 { font-size: 108px; font-weight: 800; line-height: 1.08; letter-spacing: -0.015em; }
  .lede { font-size: 44px; font-weight: 500; color: #b9d3ef; line-height: 1.45; }
  .rule { width: 210px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #67e8f9, #c4b5fd); box-shadow: 0 0 34px rgba(103,232,249,0.55); }

  .chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 54px; }
  .chip { display: flex; align-items: center; gap: 16px; padding: 20px 34px; border-radius: 999px; border: 1px solid rgba(148,197,255,0.34); background: rgba(12,32,66,0.55); font-size: 34px; font-weight: 600; color: #e3f0ff; }
  .chip b { display: block; width: 12px; height: 12px; border-radius: 50%; background: #7dd3fc; box-shadow: 0 0 16px rgba(125,211,252,0.9); }

  .stepBadge { width: 132px; height: 132px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 62px; font-weight: 800; color: #08111f; background: linear-gradient(140deg, #fde68a, #fca55a); box-shadow: 0 0 60px rgba(252,211,77,0.45); }
  .stepHead { display: flex; align-items: center; gap: 36px; }

  .watermark { position: absolute; right: 110px; bottom: 40px; font-size: 520px; font-weight: 800; line-height: 0.8; letter-spacing: -0.06em; color: rgba(122,176,255,0.10); }

  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }

  /* การ์ดสรุป 2x2 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; margin-top: 56px; }
  .card { border-radius: 32px; border: 1px solid rgba(148,197,255,0.26); background: linear-gradient(160deg, rgba(16,40,80,0.72), rgba(8,18,40,0.42)); padding: 42px 46px; display: flex; gap: 30px; align-items: flex-start; }
  .card .n { font-size: 56px; font-weight: 800; color: #fcd34d; min-width: 84px; }
  .card .t { font-size: 46px; font-weight: 700; line-height: 1.2; }
  .card .e { font-size: 25px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #7fb4e8; margin-bottom: 10px; }

  .cta { display: inline-flex; align-items: center; gap: 22px; margin-top: 60px; padding: 30px 52px; border-radius: 999px; background: linear-gradient(120deg, rgba(56,189,248,0.22), rgba(167,139,250,0.22)); border: 1px solid rgba(148,197,255,0.4); font-size: 40px; font-weight: 700; }
  .fine { margin-top: 44px; font-size: 26px; font-weight: 500; color: #91a9c4; max-width: 1400px; line-height: 1.5; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
const S = Number(P.get('scene') || 0);

const STEPS = [
  { n: '01', th: 'เริ่มต้นด้วยตัวเอง', en: 'START WITH YOURSELF',
    lede: 'วางรากฐานการเงินของตัวเองให้มั่นคงก่อนขยายทุกอย่าง',
    chips: ['ตั้งเป้าหมายที่วัดผลได้', 'ทำงบประมาณรายรับ-รายจ่าย', 'เงินสำรอง 3-6 เดือน', 'ชำระหนี้ดอกเบี้ยสูงก่อน'] },
  { n: '02', th: 'สร้างรายได้เสริม', en: 'BUILD EXTRA INCOME',
    lede: 'เพิ่มช่องทางรายได้ที่ไม่ผูกกับเงินเดือนเพียงอย่างเดียว',
    chips: ['สำรวจทักษะที่ขายได้', 'เริ่มจากช่องทางที่ทำได้จริง', 'นำรายได้ไปออมและลงทุนต่อ'] },
  { n: '03', th: 'สร้างเครือข่ายที่แข็งแกร่ง', en: 'BUILD A STRONG NETWORK',
    lede: 'ขยายผลด้วยทีมและระบบ ไม่ใช่ทำงานทุกอย่างคนเดียว',
    chips: ['หาคนที่เป้าหมายเดียวกัน', 'มอบหมายงานและไว้ใจ', 'ทำระบบให้ชัดเจนต่อเนื่อง'] },
  { n: '04', th: 'ลงทุนเพื่ออนาคต', en: 'INVEST FOR THE FUTURE',
    lede: 'ให้เงินทำงานแทนเรา ด้วยความเข้าใจความเสี่ยงที่แท้จริง',
    chips: ['เรียนรู้ก่อนลงมือทำจริง', 'กระจายความเสี่ยงหลายช่องทาง', 'ทบต้นต่อเนื่องระยะยาว'] },
];

const BRAND = `<div class="brand"><span class="dot"></span><span class="txt">AI Insurance Network</span><span class="sep"></span><span class="sub">Financial Freedom Path</span></div>`;

function dots(active) {
  return `<div class="dots">${Array.from({ length: 7 }, (_, i) => `<i class="${i === active ? 'on' : ''}"></i>`).join('')}</div>`;
}
function clock(t) { return `<div class="clock">${t}</div>`; }
function glows() {
  return `<div class="glow" style="left:-160px;top:-120px;width:900px;height:900px;background:rgba(34,211,238,0.16)"></div>
          <div class="glow" style="right:-200px;bottom:-260px;width:1100px;height:1100px;background:rgba(139,92,246,0.16)"></div>`;
}

function render() {
  const stage = document.getElementById('stage');
  if (S === 0) {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker">Financial Freedom</div>
      <h1 style="margin-top:34px">อิสรภาพทางการเงิน</h1>
      <div style="display:flex;align-items:center;gap:34px;margin-top:52px">
        <div class="rule"></div>
        <div class="lede">4 ขั้นตอน · 30 วินาที</div>
      </div>
      <div class="lede" style="margin-top:22px;font-size:38px;color:#8fb4d8">FOUR STEPS TO FINANCIAL FREEDOM</div>` + dots(0) + clock('00:00');
  } else if (S >= 1 && S <= 4) {
    const s = STEPS[S - 1];
    stage.innerHTML = glows() + BRAND + `
      <div class="stepHead"><div class="stepBadge">${s.n}</div>
        <div><div class="kicker">Step ${s.n}</div><div style="font-size:30px;font-weight:700;letter-spacing:0.24em;color:#9fc4ea;margin-top:10px">${s.en}</div></div>
      </div>
      <h2 style="margin-top:46px">${s.th}</h2>
      <div class="lede" style="margin-top:26px">${s.lede}</div>
      <div class="chips">${s.chips.map((c) => `<div class="chip"><b></b>${c}</div>`).join('')}</div>
      <div class="watermark">${s.n}</div>` + dots(S) + clock(['00:00', '00:05', '00:10', '00:15', '00:20'][S]);
  } else if (S === 5) {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker gold">The Four Steps</div>
      <h2 style="margin-top:26px">4 ขั้นตอนสู่อิสรภาพทางการเงิน</h2>
      <div class="grid">
        ${STEPS.map((s) => `<div class="card"><div class="n">${s.n}</div><div><div class="e">${s.en}</div><div class="t">${s.th}</div></div></div>`).join('')}
      </div>` + dots(5) + clock('00:24');
  } else {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker gold">Start Today</div>
      <h2 style="margin-top:26px">เริ่มจากขั้นแรกวันนี้</h2>
      <div class="lede" style="margin-top:24px">อ่านขั้นตอนทั้งหมดและวางแผนของคุณได้ในหน้าเว็บ</div>
      <div class="cta"><span style="width:16px;height:16px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 20px #38bdf8"></span>ai-insurance-network-tree · อิสรภาพทางการเงิน</div>
      <div class="fine">เนื้อหาเป็นแนวทางปฏิบัติทั่วไป ไม่ใช่การรับประกันรายได้ ผลลัพธ์ธุรกิจ หรือผลตอบแทนการลงทุน และไม่ผูกกับผลิตภัณฑ์ของบริษัทใด</div>` + dots(6) + clock('00:28');
  }
  document.title = 'scene ' + S;
  window.__ready = true;
}
render();
</script>
</body>
</html>
