<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Insurance Network Tree — International 9:16 (source)</title>
<style>
  @font-face { font-family: 'InterVar'; src: url(__INTER__) format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'ThaiVar'; src: url(__THAI__) format('truetype'); font-weight: 100 900; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'InterVar', 'ThaiVar', system-ui, sans-serif; color: #eaf4ff; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 240px 84px 200px; display: flex; flex-direction: column; justify-content: center; }

  .brand { position: absolute; left: 84px; top: 96px; display: flex; flex-direction: column; gap: 10px; }
  .brand .row { display: flex; align-items: center; gap: 16px; }
  .brand .dot { width: 13px; height: 13px; border-radius: 50%; background: #67e8f9; box-shadow: 0 0 22px #22d3ee; }
  .brand .txt { font-size: 26px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: #cfe2f7; }
  .brand .sub { font-size: 24px; font-weight: 600; letter-spacing: 0.12em; color: #7fb4e8; }

  .dots { position: absolute; left: 84px; bottom: 92px; display: flex; gap: 10px; }
  .dots i { display: block; width: 30px; height: 7px; border-radius: 99px; background: rgba(255,255,255,0.16); }
  .dots i.on { background: #67e8f9; box-shadow: 0 0 18px rgba(103,232,249,0.8); width: 68px; }
  .clock { position: absolute; right: 84px; bottom: 86px; font-size: 26px; font-weight: 700; letter-spacing: 0.2em; color: #86a8cc; }

  .kicker { font-size: 32px; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: #67e8f9; }
  .kicker.gold { color: #fcd34d; }
  h1 { font-size: 104px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em; }
  h2 { font-size: 82px; font-weight: 800; line-height: 1.12; letter-spacing: -0.015em; }
  .th { font-family: 'ThaiVar', 'InterVar', sans-serif; font-weight: 600; color: #9fc0e2; }
  .lede { font-size: 40px; font-weight: 500; color: #b9d3ef; line-height: 1.5; }
  .th-line { margin-top: 26px; font-size: 38px; }
  .rule { width: 180px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #67e8f9, #c4b5fd); box-shadow: 0 0 34px rgba(103,232,249,0.55); }

  .chips { display: flex; flex-direction: column; gap: 18px; margin-top: 52px; }
  .chip { display: flex; align-items: center; gap: 16px; padding: 24px 30px; border-radius: 28px; border: 1px solid rgba(148,197,255,0.34); background: rgba(12,32,66,0.55); font-size: 34px; font-weight: 600; color: #e3f0ff; }
  .chip b { display: block; width: 12px; height: 12px; border-radius: 50%; background: #7dd3fc; box-shadow: 0 0 16px rgba(125,211,252,0.9); }

  .stepBadge { width: 116px; height: 116px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; color: #08111f; background: linear-gradient(140deg, #fde68a, #fca55a); box-shadow: 0 0 60px rgba(252,211,77,0.45); }
  .stepHead { display: flex; align-items: center; gap: 28px; }
  .url { display: flex; align-items: center; gap: 14px; margin-top: 44px; padding: 22px 28px; border-radius: 24px; border: 1px dashed rgba(148,197,255,0.55); background: rgba(10,26,54,0.55); font-size: 28px; font-weight: 700; color: #cfe6ff; }
  .url span { color: #67e8f9; }
  .watermark { position: absolute; right: 40px; bottom: 150px; font-size: 420px; font-weight: 800; line-height: 0.8; letter-spacing: -0.06em; color: rgba(122,176,255,0.10); }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }

  .card { border-radius: 30px; border: 1px solid rgba(148,197,255,0.26); background: linear-gradient(160deg, rgba(16,40,80,0.72), rgba(8,18,40,0.42)); padding: 32px 34px; display: flex; gap: 22px; align-items: flex-start; }
  .card .n { font-size: 46px; font-weight: 800; color: #fcd34d; min-width: 62px; }
  .card .t { font-size: 34px; font-weight: 700; line-height: 1.25; }
  .card .e { font-size: 22px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #7fb4e8; margin-bottom: 8px; }
  .stack { display: flex; flex-direction: column; gap: 20px; margin-top: 46px; }
  .layers { display: flex; gap: 14px; margin-top: 44px; }
  .layers .card { flex: 1; flex-direction: column; align-items: center; text-align: center; padding: 24px 8px; }
  .layers .n { font-size: 40px; min-width: 0; }
  .layers .l { font-size: 22px; font-weight: 700; color: #8fb4d8; }

  .cta { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 48px; padding: 28px 30px; border-radius: 28px; background: linear-gradient(120deg, rgba(56,189,248,0.22), rgba(167,139,250,0.22)); border: 1px solid rgba(148,197,255,0.4); font-size: 34px; font-weight: 700; }
  .fine { margin-top: 40px; font-size: 26px; font-weight: 500; color: #91a9c4; line-height: 1.5; }
  .langs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .langs i { font-style: normal; padding: 14px 20px; border-radius: 999px; border: 1px solid rgba(148,197,255,0.3); background: rgba(12,32,66,0.5); font-size: 28px; font-weight: 600; color: #d7e8fb; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
const S = Number(P.get('scene') || 0);
const SITE = 'ai-insurance-network-tree.vercel.app';

const STEPS = [
  { n: '01', en: 'Become a Prospective Agent', th: 'สมัครเป็นตัวแทน (ผู้มุ่งหวัง)',
    chips: ['Online application', 'Auto lead scoring', 'Recruiter notified'], url: '/recruit' },
  { n: '02', en: 'Register Your Interest', th: 'สมัครแสดงความสนใจ',
    chips: ['Guided form', 'Progress tracking', 'Team assignment'], url: '/register' },
  { n: '03', en: 'Submit Your Payment Receipt', th: 'ส่งใบเสร็จรับเงิน',
    chips: ['Receipt scanning', 'Instant validation', 'Rank & commission'], url: '/documents' },
];

const FEATURES = [
  { n: '①', en: 'AI LEAD SCORING', t: 'Leads from your link are scored and routed automatically.' },
  { n: '②', en: '1-TO-5 AUTOPILOT', t: 'One agent opens 5 slots; the next layer unlocks when full.' },
  { n: '③', en: 'RECEIPT INTELLIGENCE', t: 'Premium receipts are read and matched to real periods.' },
  { n: '④', en: '17 LANGUAGES', t: 'Thai, English, Chinese, Japanese and 13 more.' },
];

const BRAND = `<div class="brand"><div class="row"><span class="dot"></span><span class="txt">AI Insurance Network Tree</span></div><span class="sub">Agent Network Platform</span></div>`;

const dots = (a) => `<div class="dots">${Array.from({ length: 7 }, (_, i) => `<i class="${i === a ? 'on' : ''}"></i>`).join('')}</div>`;
const clock = (t) => `<div class="clock">${t}</div>`;
const glows = () => `<div class="glow" style="left:-200px;top:-160px;width:900px;height:900px;background:rgba(34,211,238,0.16)"></div>
  <div class="glow" style="right:-260px;bottom:-300px;width:1100px;height:1100px;background:rgba(139,92,246,0.16)"></div>`;

function render() {
  const stage = document.getElementById('stage');
  if (S === 0) {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker">Agent Network Platform</div>
      <h1 style="margin-top:34px">Financial Freedom,<br><span style="color:#7dd3fc">step by step.</span></h1>
      <div class="th th-line">อิสรภาพทางการเงิน — เริ่มจากก้าวแรกที่ชัดเจน</div>
      <div style="display:flex;align-items:center;gap:28px;margin-top:48px;flex-wrap:wrap">
        <div class="rule"></div>
        <div class="lede" style="font-size:36px">3 STEPS · 1-TO-5 · 30 SEC</div>
      </div>
      <div class="langs"><i>🇹🇭 ไทย</i><i>🇬🇧 English</i><i>🇨🇳 中文</i><i>🇯🇵 日本語</i><i>+ 13</i></div>` + dots(0) + clock('00:00');
  } else if (S >= 1 && S <= 3) {
    const s = STEPS[S - 1];
    stage.innerHTML = glows() + BRAND + `
      <div class="stepHead"><div class="stepBadge">${s.n}</div>
        <div><div class="kicker" style="font-size:28px">Step ${s.n} of 03</div><div style="font-size:24px;font-weight:700;letter-spacing:0.16em;color:#9fc4ea;margin-top:8px">${SITE}</div></div>
      </div>
      <h2 style="margin-top:44px">${s.en}</h2>
      <div class="th th-line" style="font-size:36px">${s.th}</div>
      <div class="chips">${s.chips.map((c) => `<div class="chip"><b></b>${c}</div>`).join('')}</div>
      <div class="url">Open <span>${s.url}</span></div>
      <div class="watermark">${s.n}</div>` + dots(S) + clock(['00:00', '00:05', '00:10', '00:15'][S]);
  } else if (S === 4) {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker">The 1-to-5 Network Engine</div>
      <h2 style="margin-top:30px">One person opens 5 slots. Complete, and the next layer unlocks.</h2>
      <div class="layers">
        ${[[1, 'Layer 1'], [5, 'Layer 2'], [25, 'Layer 3'], [125, 'Layer 4'], [625, 'Layer 5']]
          .map(([n, l], i) => `<div class="card" style="${i === 0 ? 'border-color:rgba(252,211,77,0.5)' : ''}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}
      </div>
      <div class="lede" style="margin-top:38px;font-size:34px">Live tree, slot status, rotation and promotion — driven by verified premium receipts.</div>
      <div class="th th-line" style="font-size:30px">โครงสร้าง 1 → 5 → 25 → 125 → 625 · ตัวเลขจริงมาจากใบเสร็จที่ตรวจแล้ว</div>` + dots(4) + clock('00:20');
  } else if (S === 5) {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker gold" style="margin-top:20px">One Platform</div>
      <h2 style="margin-top:26px;font-size:74px">Everything the network needs.</h2>
      <div class="stack">
        ${FEATURES.map((f) => `<div class="card"><div class="n">${f.n}</div><div><div class="e">${f.en}</div><div class="t">${f.t}</div></div></div>`).join('')}
      </div>` + dots(5) + clock('00:24');
  } else {
    stage.innerHTML = glows() + BRAND + `
      <div class="kicker gold" style="margin-top:20px">Start Today</div>
      <h2 style="margin-top:26px">Your network starts with step one.</h2>
      <div class="th th-line" style="font-size:36px">เริ่มจากขั้นแรกวันนี้ — สมัครเป็นตัวแทนผ่านระบบออนไลน์</div>
      <div class="cta"><span style="width:15px;height:15px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 20px #38bdf8"></span>${SITE}</div>
      <div class="fine">General guidance only — no income, commission, return, approval or timeline is guaranteed. Network figures are illustrative, not real members.</div>
      <div class="fine" style="font-size:26px">เนื้อหาเป็นแนวทางปฏิบัติทั่วไป ไม่ใช่การรับประกันรายได้ ผลลัพธ์ธุรกิจ หรือผลตอบแทนการลงทุน</div>` + dots(6) + clock('00:28');
  }
  document.title = 'scene ' + S;
  window.__ready = true;
}
render();
</script>
</body>
</html>
